[package]
name = "deepdive"
version = "2.0.0"
edition = "2021"
rust-version = "1.93"
description = "Reverse-engineer and safety-check repositories and files before running them."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tant28403-svg/deepdive"
readme = "README.md"
keywords = ["security", "malware", "scanner", "reverse-engineering"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "color"] }
clap_complete = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.10", package = "serde_yaml_ng" }
toml = "0.8"

# File walking
walkdir = "2"
ignore = "0.4"

# Regex
regex = "1"

# Binary parsing (ELF/PE/Mach-O)
goblin = "0.8"

# Hashing / encoding
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"

# Archives
zip = "9"
tar = "0.4"
flate2 = "1"

# Temp dirs
tempfile = "3"

# Output
owo-colors = "4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP (rustls only: no OpenSSL/native-tls dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "http2", "charset"] }

# Git (pure Rust) - using system git CLI for now; gix feature available for pure-Rust backend
gix = { version = "0.90", default-features = false, features = ["basic", "blocking-http-transport-reqwest-rust-tls"], optional = true }

# Parallelism
rayon = "1"

# Error handling
anyhow = "1"
url = "2"
thiserror = "1"

# XDG dirs
directories = "5"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[features]
default = []
git-backend-gix = ["dep:gix"]
yara = ["dep:yara-x"]
# Native Linux sandbox (namespaces + seccomp + cgroups). Off by default until it
# has been validated on a Linux runner with unprivileged user namespaces.
native-sandbox = ["dep:nix", "dep:caps", "dep:libc", "dep:seccompiler"]
# Disassembly and control-flow heuristics for PE/ELF.
disasm = ["dep:iced-x86"]
# Managed runtimes.
android = []
dotnet = []
java = []
wasm = ["dep:wasmparser"]

[dependencies.wasmparser]
version = "0"
optional = true

[dependencies.iced-x86]
version = "1.21"
optional = true
default-features = false
features = ["std", "decoder", "instr_info"]

[dependencies.yara-x]
version = "1.21"
optional = true
default-features = false
features = [
    "pe-module",
    "elf-module",
    "macho-module",
    "hash-module",
    "math-module",
    "string-module",
    "lnk-module",
    "time-module",
]

[[bin]]
name = "deepdive"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["sched", "mount", "fs", "user", "process", "signal"], optional = true }
libc = { version = "0.2", optional = true }
seccompiler = { version = "0.4", optional = true }
caps = { version = "0.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3