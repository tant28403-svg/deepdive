name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: test
        run: cargo test

  audit:
    name: cargo-audit (advisory check)
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true  # Don't block on advisory DB/network issues
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22
      - name: Run cargo-audit
        run: cargo audit

  yara:
    name: yara feature (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (yara)
        run: cargo clippy --all-targets --features yara -- -D warnings
      - name: test (yara)
        run: cargo test --features yara

  features:
    name: optional features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (features)
        run: cargo clippy --all-targets --features android,disasm,dotnet,java,wasm -- -D warnings
      - name: test (features)
        run: cargo test --features android,disasm,dotnet,java,wasm

  native-sandbox:
    name: native-sandbox (ubuntu, experimental)
    runs-on: ubuntu-latest
    # Non-blocking until the backend is validated on a Linux runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check (native-sandbox)
        run: cargo check --features native-sandbox